<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%" role="img" aria-labelledby="t d">
<title id="t">The drawing of 234</title><desc id="d">234 = 2 x 3^2 x 13. Each prime points at the primes of the sum of divisors of its power, forming a triangle.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1f2933}
  .m{fill:#6b7785}.s{font-size:13px}.xs{font-size:11px}
  .lbl{font-size:15px;font-weight:600}
  .big{font-size:20px;font-weight:700}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    text{fill:#e4e7eb}.m{fill:#9aa5b1}.stroke{stroke:#7b8794}
  }
</style>

<text class="big" x="150" y="44" text-anchor="middle">234 = 2 × 3² × 13</text>
<circle cx="150.0" cy="102.0" r="25" fill="none" stroke="#2f6fb5" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="150.0" y="107.0" text-anchor="middle">2</text>
<circle cx="217.5" cy="219.0" r="25" fill="none" stroke="#2f6fb5" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="217.5" y="224.0" text-anchor="middle">3</text>
<circle cx="82.5" cy="219.0" r="25" fill="none" stroke="#2f6fb5" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="82.5" y="224.0" text-anchor="middle">13</text>
<path d="M 163.5 125.4 Q 172.3 166.0 203.0 193.9" stroke="#2f6fb5" stroke-width="2" fill="none" marker-end="url(#a)" class="stroke"/>
<path d="M 190.5 219.0 Q 151.0 206.3 111.5 219.0" stroke="#2f6fb5" stroke-width="2" fill="none" marker-end="url(#a)" class="stroke"/>
<path d="M 96.0 195.6 Q 126.7 167.7 135.5 127.1" stroke="#2f6fb5" stroke-width="2" fill="none" marker-end="url(#a)" class="stroke"/>
<text class="s" x="150" y="300" text-anchor="middle" fill="#2e7d52" font-weight="600">A triangle closes: the GIRTH of 234 is 3</text>
<text class="s mono" x="330" y="92">σ(2) = 1+2 = 3</text>
<text class="xs m" x="330" y="112">3 appears → arrow 2 → 3</text>
<text class="s mono" x="330" y="154">σ(3²) = 1+3+9 = 13</text>
<text class="xs m" x="330" y="174">13 appears → arrow 3 → 13</text>
<text class="s mono" x="330" y="216">σ(13) = 1+13 = 14 = 2 × 7</text>
<text class="xs m" x="330" y="236">2 appears → arrow 13 → 2</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
</svg>
