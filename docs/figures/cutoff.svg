<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" role="img" aria-labelledby="t d">
<title id="t">From 'the smallest we saw' to 'the smallest'</title><desc id="d">The cutoff lemma bounds the largest possible prime, so the search becomes finite.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1f2933}
  .m{fill:#6b7785}.s{font-size:13px}.xs{font-size:11px}
  .lbl{font-size:15px;font-weight:600}
  .big{font-size:20px;font-weight:700}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    text{fill:#e4e7eb}.m{fill:#9aa5b1}.stroke{stroke:#7b8794}
  }
</style>

<text class="xs" x="34" y="46" fill="#6b7785" font-weight="700">BEFORE: primes were tried as far as somebody looked</text>
<line x1="34" y1="74" x2="640" y2="74" stroke="#9aa5b1" stroke-width="2" class="stroke" stroke-dasharray="6 5"/>
<rect x="34" y="62" width="300" height="24" rx="6" fill="#9aa5b1" opacity="0.22"/>
<text class="xs m" x="660" y="79">∞</text>
<text class="xs m" x="34" y="106">…and it was never clear whether a better one lay beyond</text>
<text class="xs" x="34" y="168" fill="#2e7d52" font-weight="700">NOW: no prime above the cutoff can work, and that is proved</text>
<line x1="34" y1="196" x2="640" y2="196" stroke="#9aa5b1" stroke-width="2" class="stroke" stroke-dasharray="6 5"/>
<rect x="34" y="184" width="300" height="24" rx="6" fill="#2e7d52" opacity="0.3"/>
<line x1="334" y1="168" x2="334" y2="224" stroke="#2e7d52" stroke-width="3"/>
<text class="xs" x="342" y="222" fill="#2e7d52" font-weight="600">proved cutoff</text>
<text class="xs m" x="660" y="201">∞</text>
<text class="xs m" x="34" y="256">…so checking up to there is checking EVERYTHING</text>
</svg>
